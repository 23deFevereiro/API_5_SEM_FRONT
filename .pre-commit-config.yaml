repos:
  # ── Hooks gerais ────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict   # bloqueia se houver conflito não resolvido
      - id: no-commit-to-branch    # impede commit direto em main/master
        args: [--branch, main, --branch, master]

  # ── ESLint (Vue + JS/TS) ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.57.0
    hooks:
      - id: eslint
        files: \.(js|ts|vue)$
        additional_dependencies:
          - eslint@8.57.0
          - eslint-plugin-vue@9.24.0

  # ── Prettier (formatação geral) ───────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(js|ts|vue|css|scss|json|md)$

  # ── Validação da mensagem de commit ─────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: Validate commit message format
        language: python
        entry: python scripts/validate_commit_msg.py
        stages: [commit-msg]
        always_run: true

  # ── Validação do nome da branch ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-branch-name
        name: Validate branch name format
        language: python
        entry: python scripts/validate_branch_name.py
        stages: [pre-commit]
        always_run: true